<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدردشة - GiveAds</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chat.css"/>

</head>

<body>

<div class="header">
💬 الدردشة
<span class="give">Give</span>
<span class="ads">Ads</span>
</div>



<div class="chat-box" id="chatBox"></div>

<div class="input-box">
<input type="text" id="msgInput" placeholder="اكتب رسالة...">
<button onclick="sendMessage()">إرسال</button>
</div>

<script type="module">
import { auth, db } from "./firebase.js";

import {
  doc,
  setDoc,
  getDoc,
  updateDoc,
  arrayUnion,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentUser;
let chatId;

// 🔥 الحصول على chatId من الرابط
const urlParams = new URLSearchParams(window.location.search);
const otherUserId = urlParams.get("uid");

// 🔐 تحقق المستخدم
onAuthStateChanged(auth, (user) => {
  if(!user){
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  startChat();
});


// 🔥 إنشاء chatId ثابت بين شخصين
function createChatId(uid1, uid2){
  return uid1 > uid2 ? uid1 + "_" + uid2 : uid2 + "_" + uid1;
}


// 💬 بدء الشات
async function startChat(){

  chatId = createChatId(currentUser.uid, otherUserId);

  const chatRef = doc(db, "chats", chatId);

  const chatSnap = await getDoc(chatRef);

  if(!chatSnap.exists()){
    await setDoc(chatRef, {
      users: [currentUser.uid, otherUserId],
      createdAt: Date.now(),
      messages: []
    });
  }

  // 🔥 Real-time listener
  onSnapshot(chatRef, (docSnap) => {

    const data = docSnap.data();
    renderMessages(data.messages || []);

  });

}


// 💬 عرض الرسائل
function renderMessages(messages){

  const box = document.getElementById("chatBox");
  box.innerHTML = "";

  messages.forEach(msg => {

    const div = document.createElement("div");
    div.classList.add("msg");

    if(msg.senderId === currentUser.uid){
      div.classList.add("me");
    }

    div.innerText = msg.text;

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}


// 📤 إرسال رسالة
window.sendMessage = async function(){

  const text = document.getElementById("msgInput").value;

  if(!text) return;

  const chatRef = doc(db, "chats", chatId);

  await updateDoc(chatRef, {
    messages: arrayUnion({
      text: text,
      senderId: currentUser.uid,
      time: Date.now()
    })
  });

  document.getElementById("msgInput").value = "";
}

</script>

</body>
</html>
