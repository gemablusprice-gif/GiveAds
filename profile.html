<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الملف الشخصي - GiveAds</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="profile.css"/>

</head>

<body>

<!-- HEADER -->

<div class="header">
<h1>
الملف الشخصي - <span>GiveAds</span>
</h1>
</div>

<!-- PROFILE -->

<div class="profile">

<!-- USER INFO -->

<div class="card">

<div class="user-info">

<div class="avatar" id="avatar">
👤
</div>

<div class="user-text">

<h2 id="username">
مستخدم جديد
</h2>

<p id="email">
user@email.com
</p>

</div>

</div>

<!-- STATS -->

<div class="stats">

<div class="stat">
<h3 id="balance">0$</h3>
<p>الرصيد</p>
</div>

<div class="stat">
<h3 id="adsCount">0</h3>
<p>الإعلانات</p>
</div>

<div class="stat">
<h3 id="rating">5.0</h3>
<p>التقييم</p>
</div>

</div>

<!-- BUTTONS -->

<div class="buttons">

<button class="green" onclick="addMoney()">
💰 إضافة رصيد
</button>

<button class="blue" onclick="createAd()">
📢 نشر إعلان
</button>

<button class="yellow" onclick="editProfile()">
⚙️ تعديل الحساب
</button>

<button class="red" onclick="logout()">
🚪 تسجيل خروج
</button>

</div>

</div>

<!-- MY ADS -->

<div class="card">

<h2>
📢 إعلاناتي
</h2>

<div class="ads" id="adsList">

<div class="empty">
جارٍ تحميل الإعلانات...
</div>

</div>

</div>


<!-- NOTIFICATION BELL -->

<div class="topbar">

<div class="logo-top">
GiveAds
</div>

<div class="notification">

<button class="bell" onclick="toggleMessages()">

🔔

<span id="msgCount">
0
</span>

</button>

<div class="messages-popup" id="messagesPopup">

<h3>
الرسائل
</h3>

<div id="popupMessages">

<div class="empty">
لا توجد رسائل
</div>

</div>

</div>

</div>

</div>
<script type="module" src="profile.js"></script>
<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
doc,
getDoc,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ⏳ إخفاء التحميل
function hideLoading(){
const loader = document.getElementById("loadingScreen");
if(loader) loader.style.display = "none";
}

// 🔥 تحميل بيانات المستخدم
async function loadUser(user){

const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

if(snap.exists()){

const data = snap.data();

document.getElementById("username").innerText =
data.name || "مستخدم";

document.getElementById("email").innerText =
data.email || "";

document.getElementById("balance").innerText =
(data.balance || 0) + "$";

// صورة المستخدم
let avatar = document.getElementById("avatar");

if(data.photo){
avatar.style.backgroundImage = `url(${data.photo})`;
avatar.innerHTML = "";
}

}

}


// 🔥 تحميل إعلانات المستخدم
async function loadMyAds(user){

const adsList = document.getElementById("adsList");
const snap = await getDocs(collection(db,"ads"));

adsList.innerHTML = "";

let count = 0;

snap.forEach((docItem)=>{

const ad = docItem.data();

if(ad.userId === user.uid){

count++;

adsList.innerHTML += `
<div class="ad">
<p>📢 ${ad.title || "إعلان"}</p>
<span>💰 ${ad.budget || 0}$ | ${ad.type || ""}</span>
</div>
`;

}

});

document.getElementById("adsCount").innerText = count;

if(count === 0){
adsList.innerHTML = `
<div class="empty">لا توجد إعلانات</div>
`;
}

}


// 💬 تحميل الرسائل الحديثة

async function loadMessages(user){

const popupMessages =
document.getElementById("popupMessages");

const msgCount =
document.getElementById("msgCount");

// تحقق من العناصر

if(!popupMessages || !msgCount) return;

// شاشة تحميل

popupMessages.innerHTML = `

<div class="empty">
جارٍ تحميل الرسائل...
</div>

`;

try{

// جلب المحادثات

const chatsSnap =
await getDocs(collection(db,"chats"));

popupMessages.innerHTML = "";

let count = 0;

// لا توجد محادثات

if(chatsSnap.empty){

popupMessages.innerHTML = `

<div class="empty">
لا توجد رسائل حالياً
</div>

`;

msgCount.innerText = "0";

return;

}

// loop

for(const chatDoc of chatsSnap.docs){

const chat = chatDoc.data();

// تحقق من users

if(
!chat.users ||
!Array.isArray(chat.users)
) continue;

// هل المستخدم داخل المحادثة

if(chat.users.includes(user.uid)){

count++;

// المستخدم الآخر

const otherUserId =
chat.users.find(id => id !== user.uid);

// جلب بيانات المستخدم

let senderName = "مستخدم";
let senderEmail = "";
let senderPhoto = "";

// users collection

try{

const userRef =
doc(db,"users",otherUserId);

const userSnap =
await getDoc(userRef);

if(userSnap.exists()){

const userData =
userSnap.data();

senderName =
userData.name || "مستخدم";

senderEmail =
userData.email || "";

senderPhoto =
userData.photo || "";

}

}catch(err){

console.log("خطأ جلب المستخدم",err);

}

// صورة

let avatarHTML = "👤";

if(senderPhoto){

avatarHTML = `
<img src="${senderPhoto}"
style="
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
">
`;

}

// آخر رسالة

const lastMessage =
chat.lastMessage || "اضغط لفتح المحادثة";

// إضافة الرسالة

popupMessages.innerHTML += `

<div class="message-item"
onclick="openChat('${otherUserId}')">

<div class="message-avatar">

${avatarHTML}

</div>

<div class="message-content">

<h4>
${senderName}
</h4>

<p>
${lastMessage}
</p>

<small style="
color:#64748b;
font-size:12px;
">
${senderEmail}
</small>

</div>

</div>

`;

}

}

// عدد الرسائل

msgCount.innerText = count;

// فارغ

if(count === 0){

popupMessages.innerHTML = `

<div class="empty">
لا توجد رسائل حالياً
</div>

`;

}

}catch(error){

console.log(error);

popupMessages.innerHTML = `

<div class="empty">
حدث خطأ أثناء تحميل الرسائل
</div>

`;

}

}


// 🔐 تسجيل الدخول
onAuthStateChanged(auth, async (user)=>{

if(!user){
window.location.href = "login.html";
return;
}

// ⏳ تأخير بسيط (شكل احترافي)
await new Promise(r => setTimeout(r, 800));

// 🔥 تحميل البيانات
await loadUser(user);
await loadMyAds(user);
await loadMessages(user);

// ❌ إخفاء التحميل
hideLoading();

});


// 🚪 تسجيل خروج
window.logout = function(){

signOut(auth).then(()=>{

alert("تم تسجيل الخروج");
window.location.href = "login.html";

});

}


// ➕ إنشاء إعلان
window.createAd = function(){
window.location.href = "create-ads.html";
}


// 💬 فتح الشات
window.openChat = function(uid){
window.location.href = "chat.html?uid=" + uid;
}


// 💰 رصيد
window.addMoney = function(){
alert("قريباً نظام الدفع");
}


// ⚙️ تعديل الحساب
window.editProfile = function(){
alert("قريباً تعديل الحساب");
}

</script>
</body>
</html>
