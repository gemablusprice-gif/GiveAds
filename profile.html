<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الملف الشخصي - GiveAds</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="profile.css"/>

</head>

<body>

<!-- HEADER -->

<div class="header">
<h1>
الملف الشخصي - <span>GiveAds</span>
</h1>
</div>

<!-- PROFILE -->

<div class="profile">

<!-- USER INFO -->

<div class="card">

<div class="user-info">

<div class="avatar" id="avatar">
👤
</div>

<div class="user-text">

<h2 id="username">
مستخدم جديد
</h2>

<p id="email">
user@email.com
</p>

</div>

</div>

<!-- STATS -->

<div class="stats">

<div class="stat">
<h3 id="balance">0$</h3>
<p>الرصيد</p>
</div>

<div class="stat">
<h3 id="adsCount">0</h3>
<p>الإعلانات</p>
</div>

<div class="stat">
<h3 id="rating">5.0</h3>
<p>التقييم</p>
</div>

</div>

<!-- BUTTONS -->

<div class="buttons">

<button class="green" onclick="addMoney()">
💰 إضافة رصيد
</button>

<button class="blue" onclick="createAd()">
📢 نشر إعلان
</button>

<button class="yellow" onclick="editProfile()">
⚙️ تعديل الحساب
</button>

<button class="red" onclick="logout()">
🚪 تسجيل خروج
</button>

</div>

</div>

<!-- MY ADS -->

<div class="card">

<h2>
📢 إعلاناتي
</h2>

<div class="ads" id="adsList">

<div class="empty">
جارٍ تحميل الإعلانات...
</div>

</div>

</div>


<!-- NOTIFICATION BELL -->

<div class="topbar">

<div class="logo-top">
GiveAds
</div>

<div class="notification">

<button class="bell" onclick="toggleMessages()">

🔔

<span id="msgCount">
0
</span>

</button>

<div class="messages-popup" id="messagesPopup">

<h3>
الرسائل
</h3>

<div id="popupMessages">

<div class="empty">
لا توجد رسائل
</div>

</div>

</div>

</div>

</div>
<script type="module" src="profile.js"></script>
<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
doc,
getDoc,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ⏳ إخفاء التحميل
function hideLoading(){
const loader = document.getElementById("loadingScreen");
if(loader) loader.style.display = "none";
}


// 🔥 بيانات المستخدم
async function loadUser(user){

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

if(!snap.exists()) return;

const data = snap.data();

document.getElementById("username").innerText = data.name || "مستخدم";
document.getElementById("email").innerText = data.email || "";
document.getElementById("balance").innerText = (data.balance || 0) + "$";

let avatar = document.getElementById("avatar");

if(data.photo){
avatar.style.backgroundImage = `url(${data.photo})`;
avatar.innerHTML = "";
}
}


// 🔥 الإعلانات
async function loadMyAds(user){

const adsList = document.getElementById("adsList");
const snap = await getDocs(collection(db,"ads"));

adsList.innerHTML = "";

let count = 0;

snap.forEach(docItem=>{
const ad = docItem.data();

if(ad.userId === user.uid){
count++;

adsList.innerHTML += `
<div class="ad">
<p>📢 ${ad.title || "إعلان"}</p>
<span>💰 ${ad.budget || 0}$ | ${ad.type || ""}</span>
</div>
`;
}
});

document.getElementById("adsCount").innerText = count;

if(count === 0){
adsList.innerHTML = `<div class="empty">لا توجد إعلانات</div>`;
}
}


// 💬 الرسائل (مصححة 100%)
async function loadMessages(user){

const popupMessages = document.getElementById("popupMessages");
const msgCount = document.getElementById("msgCount");

if(!popupMessages || !msgCount) return;

popupMessages.innerHTML = `<div class="empty">جارٍ تحميل الرسائل...</div>`;

try{

const chatsSnap = await getDocs(collection(db,"chats"));

if(chatsSnap.empty){
popupMessages.innerHTML = `<div class="empty">لا توجد رسائل</div>`;
msgCount.innerText = "0";
return;
}

let count = 0;
popupMessages.innerHTML = "";

// loop
for(const chatDoc of chatsSnap.docs){

const chat = chatDoc.data();

if(!chat.users || !chat.users.includes(user.uid)) continue;

count++;

const otherUserId = chat.users.find(id => id !== user.uid);

let senderName = "مستخدم";
let senderEmail = "";
let senderPhoto = "";

try{
const userSnap = await getDoc(doc(db,"users",otherUserId));

if(userSnap.exists()){
const u = userSnap.data();
senderName = u.name || "مستخدم";
senderEmail = u.email || "";
senderPhoto = u.photo || "";
}
}catch(e){}

let avatarHTML = "👤";

if(senderPhoto){
avatarHTML = `<img src="${senderPhoto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
}

const lastMessage = chat.lastMessage || "اضغط لفتح المحادثة";

popupMessages.innerHTML += `
<div class="message-item"
onclick="openChat('${otherUserId}')">

<div class="message-avatar">${avatarHTML}</div>

<div class="message-content">
<h4>${senderName}</h4>
<p>${lastMessage}</p>
<small>${senderEmail}</small>
</div>

</div>
`;
}

msgCount.innerText = count;

if(count === 0){
popupMessages.innerHTML = `<div class="empty">لا توجد رسائل حالياً</div>`;
}

}catch(err){
console.log(err);
popupMessages.innerHTML = `<div class="empty">حدث خطأ في تحميل الرسائل</div>`;
}

}


// 🔐 تسجيل دخول
onAuthStateChanged(auth, async (user)=>{

if(!user){
window.location.href = "login.html";
return;
}

await loadUser(user);
await loadMyAds(user);
await loadMessages(user);

hideLoading();

});


// 🚪 خروج
window.logout = function(){
signOut(auth).then(()=>{
window.location.href = "login.html";
});
}


// ➕ إعلان
window.createAd = function(){
window.location.href = "create-ads.html";
}


// 💰 رصيد
window.addMoney = function(){
alert("قريباً");
}


// ⚙️ تعديل
window.editProfile = function(){
alert("قريباً");
}


// 💬 فتح الشات
window.openChat = function(uid){
window.location.href = "chat.html?uid=" + uid;
}


// 🔔 فتح/إغلاق الرسائل (مهم حتى لا يكسر الزر)
window.toggleMessages = function(){
const box = document.getElementById("messagesPopup");
if(!box) return;
box.style.display = (box.style.display === "block") ? "none" : "block";
}

</script>
</body>
</html>
