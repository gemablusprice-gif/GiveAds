<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - GiveAds</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css"/>

</head>

<body>

<div class="login-box">

<h2>تسجيل الدخول إلى <span>GiveAds</span></h2>

<input type="email" placeholder="البريد الإلكتروني" id="email">
<input type="password" placeholder="كلمة المرور" id="password">

<button class="btn-login" onclick="login()">دخول</button>

<button class="btn-google" onclick="googleLogin()">تسجيل عبر Google</button>

<p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p>

</div>

<script type="module">
import { auth, db } from "./firebase.js";

import {
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// 🔥 حفظ المستخدم في Firestore
async function saveUser(user){

  if(!user) return;

  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    await setDoc(ref, {
      name: user.displayName || "مستخدم جديد",
      email: user.email || "",
      photo: user.photoURL || "",
      balance: 0,
      createdAt: Date.now()
    });
  }
}


// 🔐 تسجيل دخول عادي
window.login = function(){

  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  if(!email || !password){
    alert("يرجى إدخال البيانات");
    return;
  }

  signInWithEmailAndPassword(auth, email, password)
  .then(async (userCredential) => {

    await saveUser(userCredential.user);

    alert("تم تسجيل الدخول");
    window.location.href = "profile.html";

  })
  .catch((error) => {
    alert(error.message);
  });
}


// 🌐 تسجيل Google
window.googleLogin = function(){

  const provider = new GoogleAuthProvider();

  signInWithPopup(auth, provider)
  .then(async (result) => {

    await saveUser(result.user);

    alert("تم تسجيل الدخول عبر Google");
    window.location.href = "profile.html";

  })
  .catch((error) => {
    alert(error.message);
  });

}


// 🔥 حماية لو المستخدم مسجل بالفعل
onAuthStateChanged(auth, (user) => {
  if(user){
    console.log("User logged in:", user.email);
  }
});

</script>

</body>
</html>
