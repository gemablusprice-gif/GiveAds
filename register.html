<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - GiveAds</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="register.css"/>

</head>

<body>

<div class="register-box">

<h2>إنشاء حساب في <span>GiveAds</span></h2>
<input type="text" placeholder="الاسم الكامل" id="name">
<input type="email" placeholder="البريد الإلكتروني" id="email">
<input type="password" placeholder="كلمة المرور" id="password">

<button class="btn-register" onclick="register()">تسجيل</button>

<button class="btn-google" onclick="googleRegister()">تسجيل عبر Google</button>

<p>لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>

</div>
<script type="module">

import { auth, db } from "./firebase.js";

import {
createUserWithEmailAndPassword,
updateProfile,
GoogleAuthProvider,
signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// 🔥 تسجيل عادي
window.register = async function(){

try{

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let password = document.getElementById("password").value;


if(!name || !email || !password){
alert("املأ جميع الحقول");
return;
}


// 🔥 إنشاء حساب
const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

const user = userCredential.user;


// 🔥 حفظ الاسم داخل Firebase Auth
await updateProfile(user,{
displayName: name
});


// 🔥 حفظ داخل Firestore
await setDoc(doc(db,"users",user.uid),{
name: name,
email: email,
photo: "",
balance: 0,
createdAt: Date.now()
});


alert("تم إنشاء الحساب بنجاح");

window.location.href = "profile.html";

}
catch(error){
alert(error.message);
}

}


// 🔥 تسجيل Google
window.googleRegister = function(){

const provider = new GoogleAuthProvider();

signInWithPopup(auth, provider)
.then(async (result)=>{

const user = result.user;


// 🔥 حفظ Google user في Firestore
await setDoc(doc(db,"users",user.uid),{

name: user.displayName || "Google User",
email: user.email,
photo: user.photoURL || "",
balance: 0,
createdAt: Date.now()

});


alert("تم التسجيل عبر Google");

window.location.href = "profile.html";

})
.catch(error=>{
alert(error.message);
});

}

</script>

</body>
</html>
