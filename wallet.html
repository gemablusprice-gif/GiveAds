<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحفظة - GiveAds</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wallet.css"/>

</head>

<body>

<div class="header">
<h1>المحفظة - <span>GiveAds</span></h1>
</div>

<div class="container">

<!-- BALANCE -->
<div class="card balance-box">
<h2 id="balance">0$</h2>
<p>رصيدك الحالي</p>

<div class="buttons">
<button class="green" onclick="addMoney()">إضافة رصيد</button>
<button class="red" onclick="withdrawMoney()">سحب رصيد</button>
<button class="blue" onclick="goHome()">الرئيسية</button>
</div>
</div>

<!-- TRANSACTIONS -->
<div class="card">
<h3>سجل العمليات</h3>

<div id="transactions">

<div class="transaction">
<span>💰 إضافة رصيد</span>
<span class="status-plus">+10$</span>
</div>

<div class="transaction">
<span>📢 إعلان مدفوع</span>
<span class="status-minus">-5$</span>
</div>

</div>

</div>

</div>

<script>

// رصيد تجريبي
let balance = 5;

function updateBalance(){
document.getElementById("balance").innerText = balance + "$";
}

// إضافة رصيد
function addMoney(){
alert("سيتم ربط الدفع لاحقاً (Stripe / PayPal / Vodafone Cash)");
balance += 10;
updateBalance();
}

// سحب رصيد
function withdrawMoney(){
if(balance <= 0){
alert("لا يوجد رصيد كافي");
return;
}

alert("طلب السحب تم إرساله (سيتم تفعيله لاحقاً)");
balance -= 5;
updateBalance();
}

// العودة
function goHome(){
window.location.href = "index.html";
}

// تشغيل
updateBalance();

</script>

</body>
</html>
