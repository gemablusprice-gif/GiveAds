<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نشر إعلان - GiveAds</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="create-ads.css"/>

</head>

<body>

<div class="header">
<h1>نشر إعلان - <span>GiveAds</span></h1>
</div>

<div class="container">

<div class="card">

<input type="text" id="title" placeholder="عنوان الإعلان">

<textarea id="description" placeholder="وصف الإعلان"></textarea>

<input type="number" id="budget" placeholder="الميزانية بالدولار">

<select id="type">
<option value="">نوع الإعلان</option>
<option value="social">إعلان سوشيال ميديا</option>
<option value="design">تصميم إعلان</option>
<option value="marketing">تسويق</option>
<option value="video">فيديو إعلاني</option>
</select>

<div class="upload">
📷 رفع صورة أو فيديو (سيتم ربطه لاحقاً بـ Firebase Storage)
<input type="file" id="file">
</div>

<button onclick="publishAd()">نشر الإعلان</button>

</div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


let currentUser = null;


// 🔐 التحقق من المستخدم

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href = "login.html";
return;

}

currentUser = user;

});


// 📢 نشر الإعلان

window.publishAd = async function(){

try{

if(!currentUser){

alert("يجب تسجيل الدخول");
return;

}

let title = document.getElementById("title").value;
let description = document.getElementById("description").value;
let budget = document.getElementById("budget").value;
let type = document.getElementById("type").value;


if(!title || !description || !budget || !type){

alert("املأ جميع الحقول");
return;

}


// 🔥 حفظ الإعلان داخل Firestore

await addDoc(collection(db,"ads"),{

title:title,
description:description,
budget:Number(budget),
type:type,

userId:currentUser.uid,
userName:currentUser.displayName || "مستخدم",
userEmail:currentUser.email,

createdAt:Date.now()

});


alert("تم نشر الإعلان بنجاح");


window.location.href = "ads.html";


}
catch(error){

console.log(error);

alert(error.message);

}

}

</script>
</body>
</html>
